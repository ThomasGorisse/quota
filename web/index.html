<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
  <meta name="description" content="Quota — your AI usage at a glance. See how much Claude, Codex and Gemini capacity you have left.">
  <meta name="referrer" content="no-referrer">
  <title>Quota — your AI usage at a glance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2322C55E' stroke-width='5' stroke-dasharray='52 18' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Quota</h1></div>
      <div class="status-group" id="status-group" hidden>
        <div class="segmented" id="display-toggle" role="group" aria-label="Show percentages as" hidden>
          <button type="button" data-mode="remaining" aria-pressed="true">Left</button>
          <button type="button" data-mode="used" aria-pressed="false">Used</button>
        </div>
        <span class="demo-badge" id="demo-badge" hidden>Demo</span>
        <span class="status-pill" id="severity" role="status">Connecting</span>
        <span class="updated" id="updated"></span>
      </div>
    </header>

    <main id="pairing" class="pairing" hidden>
      <section class="pairing-card" aria-labelledby="pairing-title">
        <span class="eyebrow">ONE LINK. EVERY LIMIT.</span>
        <h2 id="pairing-title">A little more clarity.</h2>
        <p>Pair this screen to see how much Claude, Codex and Gemini you have left.</p>
        <form id="pairing-form">
          <label for="pairing-url">Pairing URL</label>
          <input id="pairing-url" type="url" placeholder="https://your-host/#t=…" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="pairing-help pairing-error">
          <p class="help" id="pairing-help">Paste the link printed by your collector. It stays on this device.</p>
          <p class="form-error" id="pairing-error" role="alert" hidden></p>
          <button type="submit">Pair this screen <span aria-hidden="true">↗</span></button>
        </form>
        <a class="demo-link" href="?demo=1">Take a look with demo data <span aria-hidden="true">→</span></a>
      </section>
    </main>

    <main id="dashboard" class="dashboard" hidden aria-label="AI capacity remaining">
      <div class="notice" id="notice" role="status" hidden></div>
      <div class="providers" id="providers"></div>
      <footer class="footer"><span id="footer-note">Every number is what’s <strong>left.</strong></span><div class="footer-actions"><button id="history-toggle" type="button" aria-pressed="false">History</button><span id="refresh-note">Refreshes every 60 s</span></div></footer>
    </main>
    <noscript><p class="notice">Enable JavaScript to pair this screen and see your limits.</p></noscript>
  </div>
</body>
</html>
